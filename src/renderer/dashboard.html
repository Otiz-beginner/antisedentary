<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>紀錄</title>
<link rel="stylesheet" href="dashboard.css">
</head>
<body>
<nav class="rail" id="rail" aria-label="選單">
  <button type="button" class="toggle" id="rail-toggle" aria-expanded="false" aria-controls="rail" aria-label="展開選單">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <span class="label">收起</span>
  </button>
  <button type="button" id="open-settings" aria-label="設定">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    <span class="label">設定</span>
  </button>
  <button type="button" id="open-tutorial" aria-label="使用教學">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/><path d="M9 8h7M9 12h5"/></svg>
    <span class="label">使用教學</span>
  </button>
</nav>

<div class="modal-backdrop" id="settings-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-head">
      <h2 id="settings-title">設定</h2>
      <button type="button" class="modal-close" id="settings-close" aria-label="關閉設定">×</button>
    </div>
    <form id="settings-form" novalidate>
      <div id="settings-fields"></div>
      <div class="settings-actions">
        <button type="button" id="settings-reset" class="ghost">恢復預設</button>
        <button type="submit" class="primary">儲存設定</button>
      </div>
      <p class="settings-status" id="settings-status" role="status"></p>
    </form>
  </div>
</div>

<div class="page">
<main>
  <h1>紀錄</h1>

  <div class="layout">
  <div class="content">
  <section class="stats">
    <div class="panel stat"><div class="num" id="s-hours"></div><div class="lbl">總工作時間</div></div>
    <div class="panel stat"><div class="num" id="s-count"></div><div class="lbl">工作段數</div></div>
    <div class="panel stat"><div class="num" id="s-avg"></div><div class="lbl">平均每段</div></div>
    <div class="panel stat"><div class="num" id="s-notes"></div><div class="lbl">有寫紀錄的段數</div></div>
  </section>

  <section class="panel">
    <div class="streaks">
      <div class="stat"><div class="num" id="s-days"></div><div class="lbl">有工作的天數</div></div>
      <div class="stat"><div class="num" id="s-cur"></div><div class="lbl">目前連續天數</div></div>
      <div class="stat"><div class="num" id="s-max"></div><div class="lbl">最長連續天數</div></div>
    </div>
    <div class="heat-row">
      <div class="labels"><span></span><span>日</span><span></span><span>二</span><span></span><span>四</span><span></span><span>六</span></div>
      <div class="heat-wrap"><div class="heat" id="heat"></div></div>
    </div>
    <div class="legend">較少 <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> 較多（一天的工作段數）</div>
  </section>

  <section class="panel day" id="day"></section>
  </div>

  <aside class="side" aria-live="polite">
    <div class="cup" id="cup" data-tone="away">
      <div class="tank"></div>
      <div class="cup-text">
        <p class="cup-label" id="cup-label">還沒開始計時</p>
        <p class="cup-value"><span id="cup-value"></span><small id="cup-unit"></small></p>
      </div>
    </div>

    <form class="panel early" id="early-form" aria-labelledby="early-title">
      <h2 id="early-title">提早休息</h2>
      <textarea id="early-note" rows="4" placeholder="這段時間做了什麼？（可以不寫）" aria-describedby="early-hint"></textarea>
      <p class="early-hint" id="early-hint" role="status"></p>
      <button type="submit" id="early-start">開始休息</button>
      <div class="early-confirm" id="early-confirm" hidden>
        <p class="early-ask" id="early-ask">確定要休息嗎？</p>
        <div class="early-confirm-row">
          <button type="button" class="ghost" id="early-cancel">取消</button>
          <button type="button" id="early-yes">確定</button>
        </div>
      </div>
    </form>
  </aside>
  </div>
</main>
</div>
<script src="../shared/stats.js"></script>
<script src="../shared/dayView.js"></script>
<script src="../shared/sessionView.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
