<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>剛剛有站起來嗎？</title>
<link rel="stylesheet" href="water.css">
<style>
  .card { right: 10px; bottom: 10px; }
  .card .row { gap: 8px; }
  .card button.ghost { background: rgba(255,255,255,.75); color: var(--mist); box-shadow: inset 0 0 0 1px var(--slate); }
  .card button.ghost:hover { background: #fff; }
</style>
</head>
<body>
  <div class="card" id="card" role="dialog" aria-label="剛剛有站起來嗎？">
    <div class="tank"></div>
    <h3>剛剛有站起來嗎？</h3>
    <div class="row">
      <button type="button" class="ghost" id="sitting">沒有，還坐著</button>
      <button type="button" id="stood">有，站起來了</button>
    </div>
  </div>
  <script src="question.js"></script>
</body>
</html>
