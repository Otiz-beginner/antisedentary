<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>歡迎回來</title>
<link rel="stylesheet" href="water.css">
<style>
  .card { right: 10px; bottom: 10px; --level: .22; }
  .card .close { position: absolute; top: 10px; right: 10px; z-index: 2; width: 24px; height: 24px; border-radius: 50%;
                 border: 0; padding: 0; background: rgba(255,255,255,.85); color: var(--ink-soft); font-size: 15px;
                 line-height: 24px; cursor: pointer; box-shadow: inset 0 0 0 1px var(--slate); }
  .card .close:hover { background: #fff; color: var(--ink); }
  .card label { display: block; font-size: 12.5px; color: var(--ink-soft); margin: 6px 0 4px; }
  .card label .when { font-variant-numeric: tabular-nums; color: #8C97B0; margin-left: 4px; }
  .card textarea { height: 48px; }
  .field[hidden] { display: none; }
  .saved { font-size: 11.5px; color: #8C97B0; margin-right: auto; align-self: center; }
</style>
</head>
<body>
  <div class="card" id="card" role="dialog" aria-labelledby="title">
    <div class="tank"></div>
    <button type="button" class="close" id="close" aria-label="收起">×</button>
    <h3 id="title">歡迎回來</h3>
    <div class="field" id="seg-field">
      <label for="seg-note">剛才那段做了什麼？<span class="when" id="seg-when"></span></label>
      <textarea id="seg-note" placeholder="可以不寫"></textarea>
    </div>
    <div class="field" id="rest-field">
      <label for="rest-note">站起來做了什麼？<span class="when" id="rest-when"></span></label>
      <textarea id="rest-note" placeholder="例如：講電話、裝水（可以不寫）"></textarea>
    </div>
    <div class="row"><span class="saved" id="saved" aria-live="polite"></span><button type="button" id="done">完成</button></div>
  </div>
  <script src="return.js"></script>
</body>
</html>
